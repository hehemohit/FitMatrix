services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fitmatrix_postgres
    restart: always
    environment:
      POSTGRES_USER: fitmatrix_admin
      POSTGRES_PASSWORD: fitmatrix_dev_pass
      POSTGRES_DB: fitmatrix_db
    ports:
      - "5432:5432"
    volumes:
      - fitmatrix_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: fitmatrix_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  fitmatrix_pgdata:
